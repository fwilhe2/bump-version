name: 'Bump Release Version'
description: 'Bump version number to aid automated release processes'
author: 'Florian Wilhelm'
inputs:
  component:
    required: false
    description: "Part of the version number to increment. One of 'major', 'minor', 'patch'."
    default: 'minor'
  token:
    required: false
    description: 'Token used to read the latest release. Required for private repositories.'
    default: ${{ github.token }}
outputs:
  newVersion:
    description: 'The bumped version number, carrying the prefix of the latest release tag.'
runs:
  using: 'node24'
  main: 'dist/index.js'
