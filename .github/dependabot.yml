version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '01:00'
    groups:
      # Group all dependencies by with minor or patch version updates into one
      # PR with production and development dependencies grouped into separate
      # PRs.
      # All security updates and major updates are on separate PRs
      # via https://www.ianlewis.org/til/2025/02/16/dependabot-groups
      production-dependencies:
        dependency-type: 'production'
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 6 and 7 cannot be installed at all: typescript-eslint
      # peers on typescript <6.1.0, and ts-jest on <7, so npm ci fails with
      # ERESOLVE before anything is built. TypeScript 7 is the native
      # compiler, which exposes no JavaScript API for ts-jest and
      # @rollup/plugin-typescript to use. Drop this once the toolchain
      # follows, see https://github.com/fwilhe2/bump-version/pull/802.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
